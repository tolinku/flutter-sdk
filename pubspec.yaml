name: tolinku
description: Tolinku SDK for deep linking, analytics, referrals, and in-app messages.
version: 0.4.1
homepage: https://tolinku.com
repository: https://github.com/tolinku/flutter-sdk
issue_tracker: https://github.com/tolinku/flutter-sdk/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.0.0
  webview_flutter: ^4.0.0
  shared_preferences: ^2.0.0

dev_dependencies:
  test: ^1.24.0
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  plugin:
    platforms:
      # Android reads the Play Install Referrer, which names the exact click.
      android:
        package: com.tolinku.tolinku
        pluginClass: TolinkuPlugin
      # iOS has no referrer equivalent, so signal matching is the whole
      # mechanism there. This side reports the timezone and OS version, the two
      # signals Dart cannot produce in the form matching compares against.
      ios:
        pluginClass: TolinkuPlugin
