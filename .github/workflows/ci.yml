name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Pinned to the oldest Flutter this package claims to support, so the Dart
  # side is held to what pubspec.yaml promises rather than to whatever is
  # current.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test

  # The package ships Kotlin on Android and Swift on iOS. `flutter test` runs
  # Dart on the host and compiles neither, so 0.4.1 shipped an iOS plugin that
  # had never been built anywhere. These two jobs build an app against the
  # package so a mistake in either native side fails here rather than in a
  # user's first build after upgrading.
  #
  # The example app's platform folders are generated rather than committed, so
  # the published package stays small. `flutter create` rewrites the files it
  # templates, so the two that are ours are restored afterwards.
  # Built twice, once per dependency manager, because the plugin ships a
  # manifest for each and they are resolved by different toolchains. Swift
  # Package Manager is the default from Flutter 3.44, and CocoaPods trunk goes
  # read only in December 2026, so for now both are real: apps on older Flutter,
  # and apps that have not migrated, still resolve the podspec.
  #
  # The sources live under ios/tolinku/Sources so the Swift package can see
  # them, and the podspec points at that same directory. A podspec glob that
  # stops matching builds an empty pod rather than failing, so the CocoaPods
  # half of this matrix is the half that catches it.
  build-ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dependency-manager: [swift-package-manager, cocoapods]
    steps:
      - uses: actions/checkout@v4
      # Current stable rather than the pinned floor above. What is being built
      # here is an app generated from Flutter's own template, and an older
      # template pins a Kotlin Gradle plugin that today's transitive
      # dependencies will not build against. Users are on current tooling, so
      # that is what the native side should be built with.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Select the dependency manager
        run: flutter config --${{ matrix.dependency-manager == 'cocoapods' && 'no-' || '' }}enable-swift-package-manager
      - name: Generate the example's iOS project
        working-directory: example
        run: |
          flutter create --platforms=ios --org com.tolinku --project-name tolinku_example .
          git checkout -- lib/main.dart pubspec.yaml
      - name: Build iOS
        working-directory: example
        run: flutter build ios --no-codesign --debug
      # A build that quietly left the plugin out still succeeds, since nothing
      # in the example app's Dart calls into it at compile time. This asserts
      # the compiled app actually contains the plugin.
      - name: Check the plugin is in the built app
        working-directory: example
        run: |
          # The output directory differs between debug and release builds, so
          # this looks for the app rather than assuming where it landed.
          app=$(find build/ios -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$app" ]; then echo "no .app was produced"; exit 1; fi
          echo "checking $app"
          # CocoaPods links plugins as dynamic frameworks; Swift Package Manager
          # can link them straight into the executable. Either is fine, absent
          # is not.
          if find "$app/Frameworks" -iname '*tolinku*' 2>/dev/null | grep -q .; then
            echo "linked as a framework"
          elif nm "$app"/* 2>/dev/null | grep -qi 'TolinkuPlugin'; then
            echo "linked into the executable"
          else
            echo "the built app contains no Tolinku plugin code"
            find "$app" -maxdepth 2
            exit 1
          fi

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate the example's Android project
        working-directory: example
        run: |
          flutter create --platforms=android --org com.tolinku --project-name tolinku_example .
          git checkout -- lib/main.dart pubspec.yaml
      - name: Build Android
        working-directory: example
        run: flutter build apk --debug
