name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Pinned to the oldest Flutter this package claims to support, so the Dart
  # side is held to what pubspec.yaml promises rather than to whatever is
  # current.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test

  # The package ships Kotlin on Android and Swift on iOS. `flutter test` runs
  # Dart on the host and compiles neither, so 0.4.1 shipped an iOS plugin that
  # had never been built anywhere. These two jobs build an app against the
  # package so a mistake in either native side fails here rather than in a
  # user's first build after upgrading.
  #
  # The example app's platform folders are generated rather than committed, so
  # the published package stays small. `flutter create` rewrites the files it
  # templates, so the two that are ours are restored afterwards.
  # Built twice, once per dependency manager, because the plugin ships a
  # manifest for each and they are resolved by different toolchains. Swift
  # Package Manager is the default from Flutter 3.44, and CocoaPods trunk goes
  # read only in December 2026, so for now both are real: apps on older Flutter,
  # and apps that have not migrated, still resolve the podspec.
  #
  # The sources live under ios/tolinku/Sources so the Swift package can see
  # them, and the podspec points at that same directory. A podspec glob that
  # stops matching builds an empty pod rather than failing, so the CocoaPods
  # half of this matrix is the half that catches it.
  build-ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dependency-manager: [swift-package-manager, cocoapods]
    steps:
      - uses: actions/checkout@v4
      # Current stable rather than the pinned floor above. What is being built
      # here is an app generated from Flutter's own template, and an older
      # template pins a Kotlin Gradle plugin that today's transitive
      # dependencies will not build against. Users are on current tooling, so
      # that is what the native side should be built with. The floor is proven
      # separately, by build-ios-floor below.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Select the dependency manager
        run: flutter config --${{ matrix.dependency-manager == 'cocoapods' && 'no-' || '' }}enable-swift-package-manager
      - name: Generate the example's iOS project
        working-directory: example
        run: |
          flutter create --platforms=ios --org com.tolinku --project-name tolinku_example .
          git checkout -- lib/main.dart pubspec.yaml
      - name: Build iOS
        working-directory: example
        run: flutter build ios --no-codesign --debug
      # Builds the podspec on its own terms rather than as part of an app, which
      # is what catches a podspec that is malformed in ways an app build happens
      # to tolerate. Only meaningful on the CocoaPods leg.
      # Both invocations the migration guide asks for. They differ in how the
      # pod is linked, and a podspec can satisfy one and not the other.
      - name: Lint the podspec
        if: matrix.dependency-manager == 'cocoapods'
        run: |
          pod lib lint ios/tolinku.podspec --configuration=Debug --skip-tests --use-modular-headers
          pod lib lint ios/tolinku.podspec --configuration=Debug --skip-tests --use-modular-headers --use-libraries
      # Builds prove the plugin is present. Only running it proves the plugin
      # answers, and readPlatformSignals returns the same empty result whether
      # the plugin is missing or the device has nothing to say, so a build alone
      # cannot tell those apart. See example/integration_test/plugin_test.dart.
      - name: Boot a simulator
        run: |
          # The simulator takes the host's timezone, and the runners sit on GMT,
          # which is a real IANA identifier but a poor test subject: it is the
          # one case where the native answer and Dart's abbreviation look alike.
          # A region/city zone makes the difference visible. Best effort, since
          # the test does not depend on it.
          sudo systemsetup -settimezone America/New_York || true
          xcrun simctl list devices available | head -20
          device=$(xcrun simctl list devices available --json | python3 -c "
          import json,sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items(), reverse=True):
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid']); raise SystemExit
          raise SystemExit('no available iPhone simulator')
          ")
          echo "SIM_UDID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
      # Launch the app and read what it says, rather than driving it with
      # `flutter test integration_test`.
      #
      # That harness worked under CocoaPods and hung under Swift Package
      # Manager: the device log showed SpringBoard giving the app a scene, so
      # it built, installed and launched, and then the runner waited on a Dart
      # VM Service that never arrived. Twice, for 50 minutes and then for 20.
      # Whatever that is, it sits between the test runner and the app, and it
      # is not the thing this job exists to check.
      #
      # So the app prints what the native side gave it and the log is read from
      # outside. No debug connection, nothing to attach, and it answers exactly
      # the same question: does the plugin reply when it is actually running.
      - name: Build for the simulator
        working-directory: example
        timeout-minutes: 20
        run: flutter build ios --simulator --debug
      - name: Ask the running app what the plugin told it
        working-directory: example
        timeout-minutes: 10
        run: |
          app=$(find build/ios/iphonesimulator -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$app" ]; then echo "no simulator .app was produced"; exit 1; fi
          xcrun simctl install "$SIM_UDID" "$app"

          # --console-pty gives the app's stdout, where Dart's print lands. The
          # app keeps running after it prints, so this reads in the background
          # and stops as soon as the line appears. No `timeout` here: that is
          # GNU coreutils and macOS does not ship it.
          xcrun simctl launch --console-pty "$SIM_UDID" com.tolinku.tolinkuExample > launch.out 2>&1 &
          launch_pid=$!

          # Generous, because it costs nothing: the loop stops the moment the
          # line appears. The first run of this failed at 45 seconds having
          # given the app only 25 of them, since `simctl install` had spent the
          # rest, and a debug Flutter app on a cold simulator is still starting
          # at that point.
          for _ in $(seq 1 180); do
            grep -q 'TOLINKU_SIGNALS' launch.out 2>/dev/null && break
            sleep 1
          done
          kill "$launch_pid" 2>/dev/null || true

          tail -30 launch.out
          line=$(grep -m1 'TOLINKU_SIGNALS' launch.out 2>/dev/null || true)

          # Second place to look. print reaches the app's stdout, which is what
          # --console-pty captures, but it also reaches the device log, and the
          # two have different buffering. Either one answers the question.
          if [ -z "$line" ]; then
            echo "nothing on stdout; asking the device log"
            line=$(xcrun simctl spawn "$SIM_UDID" log show --last 5m --style compact \
              --predicate 'eventMessage CONTAINS "TOLINKU_SIGNALS"' 2>/dev/null \
              | grep -m1 'TOLINKU_SIGNALS' || true)
          fi
          if [ -z "$line" ]; then
            echo "The app never reported. It launched but the plugin said nothing."
            exit 1
          fi
          echo "reported: $line"

          tz=$(echo "$line" | sed -n 's/.*timezone=\([^ ]*\).*/\1/p')
          os=$(echo "$line" | sed -n 's/.*os_version=\([^ ]*\).*/\1/p')

          # An IANA identifier, which is the form deferred matching compares
          # against and the whole reason this is read natively. Dart offers an
          # abbreviation such as EST, which can never equal the stored value.
          # GMT and UTC are genuinely in the database and have no slash, so the
          # check is "not an abbreviation" rather than "contains a slash".
          case "$tz" in
            */*|GMT|UTC) echo "timezone $tz is an IANA identifier" ;;
            "") echo "no timezone: the plugin did not answer"; exit 1 ;;
            *) echo "timezone $tz is an abbreviation, so Dart answered rather than the plugin"; exit 1 ;;
          esac

          case "$os" in
            [0-9]*) echo "os_version $os came from the platform" ;;
            *) echo "os_version was \"$os\", expected leading digits"; exit 1 ;;
          esac
      - name: What the simulator saw
        if: failure()
        run: |
          xcrun simctl spawn "$SIM_UDID" log show --last 15m --style compact \
            --predicate 'processImagePath CONTAINS "Runner" OR eventMessage CONTAINS "tolinku"' \
            2>/dev/null | tail -60 || echo "no device log available"
      # A build that quietly left the plugin out still succeeds, since nothing
      # in the example app's Dart calls into it at compile time. This asserts
      # the compiled app actually contains the plugin.
      - name: Check the plugin is in the built app
        working-directory: example
        run: |
          # The output directory differs between debug and release builds, so
          # this looks for the app rather than assuming where it landed.
          app=$(find build/ios -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$app" ]; then echo "no .app was produced"; exit 1; fi
          echo "checking $app"
          # CocoaPods links plugins as dynamic frameworks; Swift Package Manager
          # can link them straight into the executable. Either is fine, absent
          # is not.
          if find "$app/Frameworks" -iname '*tolinku*' 2>/dev/null | grep -q .; then
            echo "linked as a framework"
          elif nm "$app"/* 2>/dev/null | grep -qi 'TolinkuPlugin'; then
            echo "linked into the executable"
          else
            echo "the built app contains no Tolinku plugin code"
            find "$app" -maxdepth 2
            exit 1
          fi

  # The oldest Flutter this package claims to support, building the iOS side the
  # way that version's users would.
  #
  # Package.swift depends on FlutterFramework, which the Flutter tool generates
  # only from 3.41. Both jobs above run current stable, where it always exists,
  # so neither could ever notice the floor being wrong. It was wrong when Swift
  # Package Manager support was first added: pubspec.yaml still said 3.10.0, and
  # every app between 3.24 and 3.40 with Swift Package Manager enabled would
  # have failed to resolve the package at all. A test asserts the two numbers
  # agree; this proves the number is the right one.
  build-ios-floor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Kept in step with the `flutter:` constraint in pubspec.yaml.
          flutter-version: '3.41.0'
          channel: stable
      - run: flutter config --enable-swift-package-manager
      - name: Generate the example's iOS project
        working-directory: example
        run: |
          flutter create --platforms=ios --org com.tolinku --project-name tolinku_example .
          git checkout -- lib/main.dart pubspec.yaml
      - name: Build iOS on the declared floor
        working-directory: example
        run: flutter build ios --no-codesign --debug

  # A Flutter module embedded in a native iOS app, which is the scenario the
  # FlutterFramework dependency in Package.swift exists for.
  #
  # `flutter build swift-package` consumes plugins that support Swift Package
  # Manager as Swift packages, and it is the path flutter/flutter#187047
  # describes as broken for plugins that do not declare FlutterFramework. Our
  # Package.swift declares it, and until this job nothing had ever built the
  # arrangement that makes it necessary. Every other iOS job here builds a
  # normal app, where the tool supplies the framework a level higher up and a
  # missing declaration costs nothing.
  build-add-to-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build a module that depends on this plugin
        run: |
          mkdir -p /tmp/addtoapp
          cd /tmp/addtoapp
          flutter create -t module --org com.tolinku tolinku_module
          cd tolinku_module
          # The plugin as a path dependency, the way a real module would name it.
          flutter pub add "tolinku:{'path':'$GITHUB_WORKSPACE'}"
          flutter build swift-package --build-mode=debug --no-codesign

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate the example's Android project
        working-directory: example
        run: |
          flutter create --platforms=android --org com.tolinku --project-name tolinku_example .
          git checkout -- lib/main.dart pubspec.yaml
      - name: Build Android
        working-directory: example
        run: flutter build apk --debug
