name: tolinku_example
description: Minimal app exercising the Tolinku SDK, used to build the native side in CI.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  tolinku:
    path: ../

dev_dependencies:
  # Runs integration_test/ on a real simulator, which is the only way to see
  # the native plugin answer rather than merely link.
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
