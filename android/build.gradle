// Android side of the tolinku package.
//
// Exists only to read the Play Install Referrer, the deterministic way a
// deferred link survives an install on Android. Bundled rather than delegated
// because the referrer token is Tolinku's own mechanism: the platform mints it
// onto the store link and this reads it back.
//
// Declared for Android alone in pubspec.yaml, so an iOS-only app never builds
// it.
//
// To verify compilation outside a host app:
//   printf 'rootProject.name = "t"\n' > android/settings.gradle
//   ../android-sdk/gradlew -p android assembleRelease \
//       -PtolinkuFlutterJar="$HOME/snap/flutter/common/flutter/bin/cache/artifacts/engine/android-arm/flutter.jar" \
//       -Pandroid.useAndroidX=true
//   rm android/settings.gradle

buildscript {
    // The Kotlin that Android Gradle plugin 9.5 depends on, and close to what
    // the current Flutter host template uses (2.2.20). Only the standalone
    // compile check below uses it: in a host app the app's own Kotlin Gradle
    // plugin compiles this module, so this is not a floor on anyone. Kept at
    // the same version as the native Android SDK so there is one Kotlin across
    // the Android artifacts rather than two by accident.
    ext.kotlin_version = "2.2.10"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.5.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

apply plugin: "com.android.library"

// AGP 9 compiles Kotlin itself and refuses the kotlin-android plugin, failing
// with "Cannot add extension with name 'kotlin'". AGP 8 and below still need
// it. The host app chooses the AGP version for a Flutter plugin, not us, so
// both have to keep working: testing for the extension AGP 9 registers is the
// direct test of which situation we are in, and it has to come after the
// library plugin is applied so that extension exists to be found.
if (project.extensions.findByName("kotlin") == null) {
    apply plugin: "kotlin-android"
}

android {
    namespace "com.tolinku.tolinku"
    // Google Play has required targetSdk 36 since 31 August 2026. A plugin
    // compiled against an older SDK than the app consuming it is also what AGP
    // 9 now rejects by default.
    compileSdk 36

    defaultConfig {
        // The Install Referrer library requires 21.
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // lint, not lintOptions: renamed in AGP 7.0, removed in AGP 9.
    lint {
        abortOnError false
    }
}

// The Kotlin JVM target, spelled out, and spelled out in the one form that
// works on both plugin paths.
//
// This has to agree with compileOptions.targetCompatibility above or the build
// fails with "Inconsistent JVM-target compatibility". It cannot be left to
// default: on AGP 9's built-in Kotlin it does follow targetCompatibility, but
// on AGP 8 with the kotlin-android plugin, which is what the current Flutter
// host template uses, it follows the JDK running Gradle instead. On a JDK 17
// machine that is 17 against Java's 11, and every Android build of an app using
// this plugin fails.
//
// `kotlin { compilerOptions { } }` rather than the older `kotlinOptions`:
// kotlinOptions was removed in AGP 9, and compilerOptions is understood by both
// the built-in Kotlin of AGP 9 and the Kotlin Gradle plugin 2.x that Flutter
// 3.41 and later ship with.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // The Flutter embedding is supplied by the Flutter tool in a host app. A jar
    // is accepted here only so compilation can be checked outside one.
    def flutterJar = project.findProperty("tolinkuFlutterJar")
    if (flutterJar) {
        compileOnly files(flutterJar)
    }

    implementation "com.android.installreferrer:installreferrer:2.2"
}
